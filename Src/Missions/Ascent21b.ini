; vim:ts=2:et
;
; "Ascent21b" Optimisation: the sections and keys of "Ascent2.ini", where they
; apply. The Stage Models supply the LV params, so only the AoA limits are
; left in the [LV] section. Any entry may be over-ridden on the command line
; of "Ascent21bOptTest" as "Section.Key=Value", eg
;   Mission.LaunchPad=Baykonur_31_6 Mission.Inclination=51.6
;
[LV]
; Stages 2..3:
MaxAoA2             = 20.0
; Stage1:
MaxAoA1             = 2.0

[Mission]
Perigee             = 290
Apogee              = 340
Inclination         = 64
; One of: Plesetsk_43_3, Plesetsk_43_4, Baykonur_31_6, Vostochny_1S:
LaunchPad           = Plesetsk_43_4

[Opt]
; There are at most 6 params which can be used in the optimisation process;
; "Ascent2" thrustMult{1,2}, bHat{1,2}, muHat{1,2}, alpha1 (given by the Stage
; Models) and TGap (no Ballistic Gap) do not apply. "T3" (sec) is the Stage3
; BurnTime; with "OPTIMISE", its bounds are relative to the full burn.
;
; As in "Ascent2.ini": if "payLoadMass" is NOT given a fixed value, it is the
; optimisation TARGET to be maximised; its "OPTIMISE" bounds are relative to
; the Stage Models' Lift-Off Mass w/o the PayLoad. Otherwise, the target is
; the StartMass with the Stage3 reserve off-loaded, to be minimised:
;
; NB: The initial AoA vals are the "Hand-picked" set of "Ascent21bTest":
aAoAHat2            = OPTIMISE 0.0 0.425 1.0
bAoAHat2            = OPTIMISE 0.0 0.295 1.0
T3                  = OPTIMISE 0.9 0.99 1.0
aAoAHat1            = OPTIMISE 0.0 0.0 1.0
bAoAHat1            = OPTIMISE 0.0 0.0 1.0
payLoadMass         = OPTIMISE 0.015 0.025 0.04

; Constraints (the "Ascent2.ini" vals):
MaxStartV           = 0.03
; XXX: As in "Ascent2.ini". With them, no Pad gives a feasible point; the
; best infeasible ones have SepQ at the 500 Pa limit (the Boosters separate
; at 118.9 sec) and MaxQ ~32 kPa:
QLimit              = 35000
SepQLimit           = 500
LongGLimit          = 5.0
; Not in "Ascent2.ini": the limit on |End Time Miss| (sec), ie on the gap
; between the end of the Bwd integration and the Lift-Off time; the value of
; "FindBurnTime3" ("Ascent21b::EndTimeTol"). XXX: A large value admits a
; "hold-down": the Singular Point (the actual Lift-Off) after the Lift-Off
; time, the Stage Models' propellant burnt until then being lost:
MaxEndTimeMiss      = 0.1

[Technical]
; NB: Not the 0.01 of "Ascent2.ini": with asserts on (all but the UnChecked
; mode), the Stage Models assert at some 0.01 sec nodes (see "Ascent21bTest"):
ODEIntegrStep       = 0.025
OptMaxEvals         = 25000
OptLogLevel         = 1
; XXX: Not as in "Ascent2.ini" (1): the PayLoad is maximised here, so do not
; stop at the first feasible point:
NOMADStopIfFeasible = 0
NOMADUseVNS         = 0.75
NOMADSeed           = -1
NOMADUseMT          = 1
WithFinalRun        = 1
; Not in "Ascent2.ini": if no feasible point is found, return (and do the Fi-
; nal Run on) the least infeasible one, reported as NOT CLOSED; 0 is as in
; "Ascent2" (no result):
WithInfeasibleResult = 0
FinalRunLogLevel    = 4
